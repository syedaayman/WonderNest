# Alembic configuration for WonderNest.
# Run Alembic commands from the `backend` folder, e.g. `alembic revision --autogenerate -m "msg"`.

[alembic]
# Path to the migration scripts, relative to this file's folder.
script_location = migrations

# Prepend the backend folder to sys.path so `app.*` imports resolve.
prepend_sys_path = .

# Timezone used when rendering revision dates (leave empty for local time).

# Blank on purpose: the database URL is read from settings.DATABASE_URL in env.py.
# Do not put credentials here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
